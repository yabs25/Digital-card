section{margin-bottom:42px}.actions{list-style:none;padding:0;margin:0}.actions li{border-bottom:3px solid var(--line)}.action{display:flex;align-items:center;gap:25px;min-height:105px;padding:22px 25px;color:var(--ink);text-decoration:none;font-size:21px;font-weight:700}.action .arrow{margin-left:auto;color:#96a08e;font-size:23px;font-weight:400}.action:focus-visible,.save:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}.action:hover{background:#e9ecdd}

/* Circular profile photo */
.mark {
    position: absolute;
    width: 100px;
    height: 100px;
    left: 50%;
    bottom: -35px;
    transform: translateX(-50%);
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #f4f5e9;
    background-color: #748b48;
    box-sizing: content-box;
}

.mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}
